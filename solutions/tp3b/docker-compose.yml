services:
  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required in .env}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - PROJECT_PREFIX=${PROJECT_PREFIX:-tfaws-student}
      - TF_VAR_project_prefix=${PROJECT_PREFIX:-tfaws-student}
      - TF_VAR_region=${AWS_REGION:-us-east-1}
    volumes:
      - ./:/workspace
    command: ["sleep", "infinity"]

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required in .env}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required in .env}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - PROJECT_PREFIX=${PROJECT_PREFIX:-tfaws-student}
    volumes:
      - ./:/workspace
    ports:
      - "127.0.0.1:8501:8501"
